# Сборка установщиков для Windows, Linux и macOS и выпуск релиза на GitHub.
# Запускается, когда в репозиторий пушат тег версии (например v0.1.2).
# Релиз создаётся черновиком: владелец
# проверяет файлы и сам нажимает «Publish release».
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          — содержимое .secrets/soma-amp.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — содержимое .secrets/password.txt

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # До сборки: тег совпадает с версией в Cargo.toml и в CHANGELOG.md есть раздел этой версии.
  # Иначе сборка не начинается — кривой релиз не выйдет.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Версия и CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$crate" = "$ver" ] || { echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $crate в Cargo.toml"; exit 1; }
          grep -q "^## \[$ver\]" CHANGELOG.md || { echo "::error::В CHANGELOG.md нет раздела [$ver]"; exit 1; }

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest          # Mac на Apple Silicon (M1 и новее)
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest          # Mac на Intel
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Системные библиотеки для Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Описание релиза из CHANGELOG.md
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # берём строки между «## [версия]» и следующим «## [»
          awk -v v="$ver" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo 'body<<EOF_NOTES'
            cat notes.md
            echo
            echo 'Какой файл скачать — в [README](https://github.com/DeemMoor/soma-amp#readme).'
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # у нас нет package.json — берём Tauri CLI из npm той же второй версии
          tauriScript: npx --yes @tauri-apps/cli@^2
          tagName: ${{ github.ref_name }}
          releaseName: 'Soma Amp ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

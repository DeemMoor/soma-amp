[package]
name = "soma-amp"
version = "0.1.0"
description = "Soma Amp — десктопный плеер радио SomaFM"
authors = ["deemmoor"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "soma_amp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = ["tray-icon"] }

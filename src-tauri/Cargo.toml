[package]
name = "soma-amp"
version = "0.1.2"
description = "Soma Amp — десктопный плеер радио SomaFM"
authors = ["deemmoor"]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "soma_amp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-localhost = "2"
tauri-plugin-updater = "2"
